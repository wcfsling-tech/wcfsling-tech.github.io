<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Webpage</title>
    <!-- Link to the external CSS stylesheet for styling -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header Section: Contains the main title and welcome message -->
    <header>
        <h1 id="main-title">Welcome to My Website!</h1>
        <p>Created by an aspiring web developer.</p>
    </header>

    <!-- Main Content Section -->
    <main>
        <section class="card">
            <h2>About This Site</h2>
            <p>This is a starter template hosted on GitHub Pages. I can customize this text, add images, and build awesome features!</p>
            
            <!-- Interactive Button -->
            <button id="interactive-btn">Click Me!</button>
            <p id="message-display"></p>
        </section>
    </main>

    <!-- Footer Section: Contains copyright or quick details -->
    <footer>
        <p>&copy; 2026 My Awesome Website</p>
    </footer>

    <!-- Link to the external JavaScript file for interactivity -->
    <script src="script.js"></script>
</body>
</html>
