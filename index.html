<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlayStation 4 Dashboard</title>
    <!-- Link to the stylesheet for PS4 styling -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Dynamic Ambient Background Container -->
    <div id="dynamic-bg" class="ps4-bg"></div>
    <div class="bg-overlay"></div>

    <div class="ps4-dashboard">
        
        <!-- Top Utility Bar (Clock, Notifications, User Profile) -->
        <header class="top-bar">
            <div class="top-bar-left">
                <span class="ps-logo">🎮 PlayStation</span>
            </div>
            <div class="top-bar-right">
                <span class="status-item">🔔 <span id="notif-count">2</span></span>
                <span class="status-item">👤 GamerTag_99</span>
                <span class="status-item clock" id="ps4-clock">12:00 PM</span>
            </div>
        </header>

        <!-- Main Game Content Horizontal Tile Bar -->
        <main class="content-row">
            <!-- 
              PERSONALIZATION:
              This tile now represents Call of Duty: Vanguard.
              We've updated:
              - data-title: The name displayed in the info panel.
              - data-desc: The description displayed in the info panel.
              - data-bg: The key used to trigger the correct background in JS/CSS.
              - The icon has been removed in favor of a full-size image inside the CSS.
            -->
            <div class="tile active cod-tile" data-title="Call of Duty: Vanguard" data-desc="Experience the raw intensity of WWII combat on a global scale. Rise on every front." data-bg="vanguard">
                <!-- We will add the title label through CSS for better control with the background image -->
                <div class="tile-label cod-label">C.O.D. Vanguard</div>
            </div>

            <div class="tile" data-title="God of War" data-desc="Journey across the Norse realms with Kratos and Atreus." data-bg="godofwar">
                <div class="tile-icon">🪓</div>
                <div class="tile-label">God of War</div>
            </div>

            <div class="tile" data-title="Horizon Zero Dawn" data-desc="Uncover the mysteries of a world ruled by machines." data-bg="horizon">
                <div class="tile-icon">🏹</div>
                <div class="tile-label">Horizon</div>
            </div>

            <div class="tile" data-title="Library" data-desc="View all installed applications and games." data-bg="library">
                <div class="tile-icon">📚</div>
                <div class="tile-label">Library</div>
            </div>
        </main>

        <!-- Lower Panel: Displays details of currently selected game -->
        <footer class="game-info-panel">
            <!-- 
              PERSONALIZATION:
              These IDs are updated dynamically by JavaScript when the 'vanguard' tile is active.
            -->
            <h2 id="active-title">Call of Duty: Vanguard</h2>
            <p id="active-desc">Experience the raw intensity of WWII combat on a global scale. Rise on every front.</p>
            <div class="action-prompt">Press <strong>[X]</strong> or Click to Start</div>
        </footer>

    </div>

    <!-- Link to external JavaScript fille -->
    <script src="script.js"></script>
</body>
</html>
